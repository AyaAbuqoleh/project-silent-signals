
name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    # نخلي كل الأوامر تشتغل داخل مجلد frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # مهم: مسار الـ lock داخل frontend
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # (اختياري) Lint/Test إن وُجدت سكربتاتها
      # - name: Lint
      #   run: npm run lint
      # - name: Test
      #   run: npm test -- --ci

      # 👇 استخدمي grep (لينكس) لاكتشاف وجود سكربت build
      - name: Build (if build script exists)
        run: |
          if npm run | grep -qE '(^| )build( |:)'; then
            echo "Build script found. Running build..."
            npm run build
          else
            echo "No build script found. Skipping build step."
          fi

      # ارفعي ناتج البناء كـ Artifact إذا وُجد مجلد dist/
      - name: Upload build artifact (if dist exists)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/**
          if-no-files-found: ignore

      # (اختياري) ارفعي ملفات السورس أيضًا
      - name: Upload site sources
        uses: actions/upload-artifact@v4
        with:
          name: site-sources
          path: |
            frontend/**/*.html
            frontend/**/*.css
            frontend/**/*.js
            frontend/**/*.png
            frontend/**/*.jpg
            frontend/**/*.svg
            !frontend/node_modules/**
