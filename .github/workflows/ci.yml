
name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # (اختياري) تأكيد وجود الملفات الأساسية
      - name: Verify project files exist
        run: |
          test -f index.html
          echo "index.html found ✅"
          # أضيفي أي ملفات أساسية عندك:
          # test -f css/style.css
          # test -f js/app.js

      # (اختياري قوي) فحص الروابط في صفحات HTML
      # لا يحتاج package-lock.json
      - name: Check HTML links (light)
        run: |
          npx -y broken-link-checker http://localhost --filter-level 3 || true
        # ملاحظة: هذا فحص خفيف؛ لو بدك فحص ملفات محليًا بدون سيرفر
        # فيكِ تستبدليه بأداة ثانية لاحقًا.

      # رفع ملفات الموقع كـ Artifact
      - name: Upload site files
        uses: actions/upload-artifact@v4
        with:
          name: site-files
          path: |
            **/*.html
            **/*.css
            **/*.js
            **/*.png
            **/*.jpg
            **/*.svg
            !node_modules/**
