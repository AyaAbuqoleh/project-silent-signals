
name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend   # 👈 مهم: كل الأوامر ستعمل داخل frontend/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'  # 👈 الكاش يعتمد على lock داخل frontend

      - name: Install dependencies (npm ci)
        run: npm ci

      # اختياري: تشغيل لينتر/اختبارات إن وجدت
      # - name: Lint
      #   run: npm run lint

      # - name: Test
      #   run: npm test -- --ci

      - name: Build (Vite or your build script)
        run: |
          if npm run | findstr /I "\<build\>" >nul 2>&1; then
            npm run build
          else
            echo "No build script found. Skipping build step."
          fi

      # ارفع ناتج البناء كـ Artifact لو وجد dist/
      - name: Upload build artifact (if present)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/dist/**
          if-no-files-found: ignore

      # (اختياري) رفع ملفات الموقع كـ Artifact حتى لو ما في build
      - name: Upload site sources
        uses: actions/upload-artifact@v4
        with:
          name: site-sources
          path: |
            frontend/**/*.html
            frontend/**/*.css
            frontend/**/*.js
            frontend/**/*.png
            frontend/**/*.jpg
            frontend/**/*.svg
            !frontend/node_modules/**
