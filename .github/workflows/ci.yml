
name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # =========================
  # Frontend (Node/Vite)
  # =========================
  frontend:
    name: Frontend (Node/Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend   # 👈 كل أوامر النود داخل frontend/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build (if build script exists)
        run: |
          if npm run | grep -qE '(^| )build( |:)'; then
            echo "Build script found. Running build..."
            npm run build
          else
            echo "No build script found. Skipping build step."
          fi

      - name: Upload build artifact (if dist exists)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/**
          if-no-files-found: ignore

      - name: Upload site sources
        uses: actions/upload-artifact@v4
        with:
          name: site-sources
          path: |
            frontend/**/*.html
            frontend/**/*.css
            frontend/**/*.js
            frontend/**/*.png
            frontend/**/*.jpg
            frontend/**/*.svg
            !frontend/node_modules/**

  # =========================
  # Backend (.NET)
  # =========================
  backend:
    name: Backend (.NET restore/build with lock files)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # مبدئيًا بدون cache لتجنب الخطأ.
      # بعد ما تدفعي packages.lock.json سنفعل cache (أرسلته لكِ أدناه كـ Patch صغير).
     
- name: Setup .NET 8 (with cache)
  uses: actions/setup-dotnet@v4
  with:
    dotnet-version: '8.0.x'
    cache: true

      # توليد ملفات القفل واستعادة الحزم لكل مشاريع .csproj
      - name: Restore with lock files for all projects
        shell: bash
        run: |
          set -e
          PROJS=$(git ls-files '*.csproj' || true)
          if [ -z "$PROJS" ]; then
            echo "No .csproj found. Skipping backend steps."
            exit 0
          fi
          echo "Found projects:"
          echo "$PROJS"
          echo "$PROJS" | while read -r proj; do
            echo "Restoring $proj with lock file..."
            dotnet restore "$proj" --use-lock-file
          done

      # بناء الحل إن وُجد، وإلّا بناء المشاريع كلٍ على حدة
      - name: Build solution/projects
        shell: bash
        run: |
          set -e
          SLNS=$(git ls-files '*.sln' || true)
          if [ -n "$SLNS" ]; then
            for sln in $SLNS; do
              echo "Building solution $sln ..."
              dotnet build "$sln" --configuration Release --no-restore
            done
          else
            PROJS=$(git ls-files '*.csproj' || true)
            for proj in $PROJS; do
              echo "Building project $proj ..."
              dotnet build "$proj" --configuration Release --no-restore
            done
          fi

      # (اختياري) تشغيل الاختبارات إن وُجدت مشاريع Test
      - name: Test (if test projects exist)
        shell: bash
        run: |
          set -e
          TESTS=$(git ls-files '*Test*.csproj' || true)
          if [ -z "$TESTS" ]; then
            echo "No test projects found. Skipping tests."
            exit 0
          fi
          for t in $TESTS; do
            echo "Running tests in $t ..."
            dotnet test "$t" --configuration Release --no-build --no-restore
          done
